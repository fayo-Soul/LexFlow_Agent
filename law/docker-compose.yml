# ============================================
# 法律咨询 RAG 系统 — Docker Compose（基础服务）
# ============================================
# 只在 VMware VM 上跑基础设施服务。
# Python 代码在本机（Windows）直接运行，通过网络连接这些服务。
#
# 本机 .env 中的地址应填 VM 的 IP：192.168.88.100
#
# 启动：docker compose up -d
# 停止：docker compose down
# ============================================

services:

  # ---------- MySQL（结构化问答对存储） ----------
  mysql:
    image: mysql:8.0
    container_name: law-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: law_rag_2024
      MYSQL_DATABASE: fzt_law
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=law_rag_2024"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis（会话缓存） ----------
  redis:
    image: redis:7-alpine
    container_name: law-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Milvus 向量数据库 ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: law-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:latest
    container_name: law-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  milvus:
    image: milvusdb/milvus:latest
    container_name: law-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CACHE_CACHESIZE: "2"
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus

# ---------- 持久化卷 ----------
volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
