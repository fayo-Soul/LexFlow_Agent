[project]
name = "lawfirm-legal-knowledge-rag"
version = "0.5.0"
description = "律所法律知识库 RAG 系统"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "PyMySQL==1.1.1",
    "redis==5.3.1",
    "pymilvus==2.5.4",
    "milvus-model==0.2.5",
    "sentence-transformers==3.0.1",
    "transformers==4.45.0",
    "torch==2.6.0",
    "langchain-core==1.2.16",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",
    "openai==2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests that may initialize external components",
]
